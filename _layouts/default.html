<!doctype html>
<html lang="{{ site.lang | default: 'ru' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>{{ page.title | default: site.title }}</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path d='M8 3h16v26l-8-6-8 6z' fill='%23c2410c'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #faf8f5;
      --text: #1c1917;
      --muted: #a8a29e;
      --line: #e7e5e4;
      --accent: #c2410c;
      --mark-l: 62%;
      --mark-c: 0.13;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161412;
        --text: #e7e5e4;
        --muted: #78716c;
        --line: #292524;
        --accent: #fb923c;
        --mark-l: 58%;
        --mark-c: 0.11;
      }
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 400 16px/1.4 "Onest", system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main {
      max-width: 820px;
      margin: 0 auto;
      padding: 40px 16px 48px;
    }
    h1 {
      margin: 0 0 24px;
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    h2 {
      margin: 24px 0 8px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    ul {
      margin: 0;
      padding: 0;
      list-style: none;
    }
    @media (min-width: 480px) { ul { columns: 2; column-gap: 24px; } }
    @media (min-width: 760px) { ul { columns: 3; } }
    li { break-inside: avoid; }
    a {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 4px 0;
      color: inherit;
      text-decoration: none;
      transition: color .15s;
    }
    a:hover, a:focus-visible { color: var(--accent); outline: none; }
    .mark {
      flex: none;
      display: grid;
      place-items: center;
      width: 22px;
      height: 22px;
      border-radius: 6px;
      background: oklch(var(--mark-l) var(--mark-c) var(--h));
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      line-height: 1;
      transition: transform .15s;
    }
    a:hover .mark { transform: scale(1.08); }
  </style>
</head>
<body>
  <main>
    <h1>{{ page.title | default: site.title }}</h1>
    {{ content }}
  </main>
  <script>
    // Цветной значок с первой буквой названия. Цвета разведены «золотым углом»,
    // чтобы соседние ссылки никогда не получали похожий оттенок.
    document.querySelectorAll('main li a').forEach(function (a, i) {
      var name = a.textContent.trim();
      var letter = (name.match(/\p{L}|\d/u) || ['•'])[0].toUpperCase();
      var mark = document.createElement('span');
      mark.className = 'mark';
      mark.setAttribute('aria-hidden', 'true');
      mark.style.setProperty('--h', (20 + i * 137.508) % 360);
      mark.textContent = letter;
      a.prepend(mark);
    });
  </script>
</body>
</html>
